<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>TOT signed successfully</title>
<!--
  Landing page for EMSIGNER_REDIRECT_URL (where eMudhra sends the signer after signing).
  For the VOB front end: self-contained (no libraries, no network calls); copy the markup into a route/page of your framework,
  e.g. https://<vob-host>/esign/success, and put that URL in the Admin .env as EMSIGNER_REDIRECT_URL.
  It reads nothing from the address: eMudhra may append query values, they are ignored and never shown.
  Every serial signer (Vendor, Central Buyer, Manager Central Buying, GM Buying) lands here after signing, so the text stays general.
-->
<style>
  :root {
    --bg: #f4f6fa; --card: #ffffff; --text: #16233b; --muted: #5b6678; --line: #e2e6ee;
    --ok: #1d7a34; --ok-soft: #e4f4e8;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f1624; --card: #172033; --text: #eef1f7; --muted: #9aa5b8; --line: #263147; --ok: #4cc26a; --ok-soft: #173826; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: var(--bg); color: var(--text);
         font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .card { width: 100%; max-width: 440px; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 40px 28px 32px;
          text-align: center; box-shadow: 0 8px 30px rgba(22, 35, 59, .08); }
  .tick { width: 104px; height: 104px; margin: 0 auto 22px; display: block; }
  .tick .disc { fill: var(--ok-soft); transform-origin: 50% 50%; animation: pop .45s cubic-bezier(.2, .9, .3, 1.3) both; }
  .tick .ring { fill: none; stroke: var(--ok); stroke-width: 4; stroke-linecap: round; stroke-dasharray: 289; stroke-dashoffset: 289;
                transform: rotate(-90deg); transform-origin: 50% 50%; animation: draw .6s ease-out .15s forwards; }
  .tick .check { fill: none; stroke: var(--ok); stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 50; stroke-dashoffset: 50;
                 animation: draw .4s ease-out .7s forwards; }
  h1 { margin: 0 0 10px; font-size: 1.45rem; line-height: 1.25; }
  p { margin: 0 0 8px; color: var(--muted); line-height: 1.5; }
  .fade { opacity: 0; animation: rise .5s ease-out 1s forwards; }
  h1.fade { animation-delay: .9s; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  @keyframes pop { from { transform: scale(.4); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) {
    .tick .disc, .tick .ring, .tick .check, .fade { animation: none; opacity: 1; stroke-dashoffset: 0; transform: none; }
    .tick .ring { transform: rotate(-90deg); }
  }
</style>
</head>
<body>
  <main class="card" role="status" aria-live="polite">
    <svg class="tick" viewBox="0 0 104 104" aria-hidden="true">
      <circle class="disc" cx="52" cy="52" r="46"/>
      <circle class="ring" cx="52" cy="52" r="46"/>
      <path class="check" d="M32 54 L46 68 L73 38"/>
    </svg>
    <h1 class="fade">TOT signed successfully</h1>
    <p class="fade">Your signature has been recorded. The agreement continues to the remaining signers, if any.</p>
    <p class="fade">You can now close this window.</p>
  </main>
</body>
</html>
